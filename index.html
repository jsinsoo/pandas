<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pandas 10단계 학습 INDEX</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
    font-family:'Malgun Gothic',sans-serif;
    background:linear-gradient(135deg,#eef6ff,#f8fafc,#ecfeff);
    height:100vh;
    overflow:hidden;
}
header{
    background:linear-gradient(90deg,#0f172a,#1d4ed8,#0891b2);
    color:white;
    text-align:center;
    padding:18px;
    box-shadow:0 4px 15px rgba(0,0,0,0.2);
}
header h1{
    font-size:28px;
    margin-bottom:5px;
}
header p{
    font-size:14px;
    opacity:0.9;
}
nav{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:10px;
    padding:12px;
    background:white;
    border-bottom:1px solid #ddd;
}
nav button{
    border:none;
    background:#2563eb;
    color:white;
    padding:10px 18px;
    border-radius:20px;
    cursor:pointer;
    font-weight:bold;
    transition:0.3s;
}
nav button:hover{
    background:#0f766e;
    transform:translateY(-2px);
}
.viewer{
    width:100%;
    height:calc(100vh - 150px);
}
iframe{
    width:100%;
    height:100%;
    border:none;
    background:white;
}
.info{
    text-align:center;
    padding:8px;
    background:#f8fafc;
    font-size:13px;
    color:#334155;
}
</style>
<script>
function openPage(page,title){
    document.getElementById("viewerFrame").src=page;
    document.getElementById("currentTitle").innerText=title;
}
</script>
</head>
<body>

<header>
    <h1>🐼 Pandas 10단계 학습 로드맵</h1>
    <p>기초 → 실전 프로젝트까지 한 번에 학습하는 통합 플랫폼</p>
</header>

<nav>
    <button onclick="openPage('pan01.html','1단계 Pandas 입문')">1단계</button>
    <button onclick="openPage('pan02.html','2단계 데이터 입출력')">2단계</button>
    <button onclick="openPage('pan03.html','3단계 데이터 탐색')">3단계</button>
    <button onclick="openPage('pan04.html','4단계 선택/필터링')">4단계</button>
    <button onclick="openPage('pan05.html','5단계 데이터 전처리')">5단계</button>
    <button onclick="openPage('pan06.html','6단계 그룹 분석')">6단계</button>
    <button onclick="openPage('pan07.html','7단계 데이터 결합')">7단계</button>
    <button onclick="openPage('pan08.html','8단계 시계열 분석')">8단계</button>
    <button onclick="openPage('pan09.html','9단계 고급 문법')">9단계</button>
    <button onclick="openPage('pan10.html','10단계 실전 프로젝트')">10단계</button>
</nav>

<div class="info">
    현재 학습 페이지: <strong id="currentTitle">1단계 Pandas 입문</strong>
</div>

<div class="viewer">
    <iframe id="viewerFrame" src="pan01.html"></iframe>
</div>

</body>
</html>
